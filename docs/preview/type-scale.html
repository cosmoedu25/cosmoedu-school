<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px 20px;background:#fff;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #F1F5F9;padding-bottom:4px;}
  .size-label{font-size:9px;font-weight:700;color:#94A3B8;width:52px;flex-shrink:0;font-family:monospace;}
  .sample{color:#0F172A;line-height:1.2;}
  .meta{font-size:9px;color:#CBD5E1;margin-left:auto;font-family:monospace;white-space:nowrap;}
</style>
</head>
<body>
  <div class="row"><span class="size-label">5xl / 3rem</span><span class="sample" style="font-size:3rem;font-weight:900;line-height:1;">AI 코딩 교육</span><span class="meta">900 / hero</span></div>
  <div class="row"><span class="size-label">4xl / 2.25rem</span><span class="sample" style="font-size:2.25rem;font-weight:800;">학년별 맞춤 수업</span><span class="meta">800 / h2</span></div>
  <div class="row"><span class="size-label">3xl / 1.875rem</span><span class="sample" style="font-size:1.875rem;font-weight:700;">커리큘럼 안내</span><span class="meta">700 / h3</span></div>
  <div class="row"><span class="size-label">xl / 1.25rem</span><span class="sample" style="font-size:1.25rem;font-weight:600;">플랫폼 주요 기능</span><span class="meta">600 / subhead</span></div>
  <div class="row"><span class="size-label">base / 1rem</span><span class="sample" style="font-size:1rem;color:#64748B;">학교·학원·대안학교를 위한 AI·코딩 교육 솔루션을 제공합니다.</span><span class="meta">400 / body</span></div>
  <div class="row"><span class="size-label">sm / .875rem</span><span class="sample" style="font-size:.875rem;color:#94A3B8;">* 2·3회차는 난이도가 심화됩니다</span><span class="meta">400 / caption</span></div>
  <div class="row"><span class="size-label">xs / .75rem</span><span class="sample" style="font-size:.75rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#0891B2;">CLASS FEATURES</span><span class="meta">700 / chip label</span></div>
</body>
</html>
