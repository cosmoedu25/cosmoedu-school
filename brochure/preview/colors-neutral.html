<!-- @dsCard group="Colors" viewport="700x160" name="Neutral Colors" subtitle="Slate scale for text, backgrounds, borders" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px 20px;background:#F8FAFC;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:6px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;}
  .chip{width:100%;height:44px;border-radius:8px;border:1px solid rgba(0,0,0,.06);}
  .name{font-size:8.5px;font-weight:700;color:#475569;text-align:center;}
  .val{font-size:7.5px;color:#94A3B8;text-align:center;font-family:monospace;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0F172A;"></div><div class="name">950</div><div class="val">#0F172A</div></div>
    <div class="swatch"><div class="chip" style="background:#1E293B;"></div><div class="name">800</div><div class="val">#1E293B</div></div>
    <div class="swatch"><div class="chip" style="background:#475569;"></div><div class="name">600</div><div class="val">#475569</div></div>
    <div class="swatch"><div class="chip" style="background:#64748B;"></div><div class="name">500</div><div class="val">#64748B</div></div>
    <div class="swatch"><div class="chip" style="background:#94A3B8;"></div><div class="name">400</div><div class="val">#94A3B8</div></div>
    <div class="swatch"><div class="chip" style="background:#E2E8F0;"></div><div class="name">200</div><div class="val">#E2E8F0</div></div>
    <div class="swatch"><div class="chip" style="background:#F1F5F9;"></div><div class="name">100</div><div class="val">#F1F5F9</div></div>
    <div class="swatch"><div class="chip" style="background:#F8FAFC;"></div><div class="name">50</div><div class="val">#F8FAFC</div></div>
    <div class="swatch"><div class="chip" style="background:#FFFFFF;"></div><div class="name">White</div><div class="val">#FFFFFF</div></div>
  </div>
</body>
</html>
