<!-- @dsCard group="Colors" viewport="700x160" name="Brand Colors" subtitle="Primary blue, cyan, purple accent palette" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px 20px;background:#F8FAFC;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;gap:8px;align-items:flex-start;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
  .chip{width:100%;height:48px;border-radius:10px;}
  .name{font-size:9px;font-weight:700;color:#475569;text-align:center;letter-spacing:.04em;}
  .val{font-size:8px;color:#94A3B8;text-align:center;font-family:monospace;}
  .group-label{font-size:9px;font-weight:800;color:#94A3B8;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px;}
</style>
</head>
<body>
  <div class="group-label">Brand</div>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#2563EB;"></div><div class="name">Blue</div><div class="val">#2563EB</div></div>
    <div class="swatch"><div class="chip" style="background:#1D4ED8;"></div><div class="name">Blue Dark</div><div class="val">#1D4ED8</div></div>
    <div class="swatch"><div class="chip" style="background:#3B82F6;"></div><div class="name">Blue Light</div><div class="val">#3B82F6</div></div>
    <div class="swatch"><div class="chip" style="background:#0891B2;"></div><div class="name">Cyan</div><div class="val">#0891B2</div></div>
    <div class="swatch"><div class="chip" style="background:#06B6D4;"></div><div class="name">Cyan Light</div><div class="val">#06B6D4</div></div>
    <div class="swatch"><div class="chip" style="background:#7C3AED;"></div><div class="name">Purple</div><div class="val">#7C3AED</div></div>
    <div class="swatch"><div class="chip" style="background:#059669;"></div><div class="name">Green</div><div class="val">#059669</div></div>
    <div class="swatch"><div class="chip" style="background:#D97706;"></div><div class="name">Amber</div><div class="val">#D97706</div></div>
  </div>
</body>
</html>
