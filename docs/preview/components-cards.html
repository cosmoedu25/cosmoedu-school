<!-- @dsCard group="Components" viewport="700x200" name="Cards" subtitle="Light program card, dark feature card, stats card" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:16px 20px;background:#F1F5F9;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;gap:14px;align-items:flex-start;}
  /* Light program card */
  .card-light{background:white;border-radius:16px;padding:18px;box-shadow:0 5px 15px rgba(0,0,0,.08);flex:1;min-width:0;}
  .card-icon{width:40px;height:40px;border-radius:10px;background:rgba(37,99,235,.1);display:flex;align-items:center;justify-content:center;font-size:18px;color:#2563EB;margin-bottom:10px;}
  .card-title{font-size:.95rem;font-weight:700;color:#0F172A;margin-bottom:4px;}
  .card-desc{font-size:.8rem;color:#64748B;line-height:1.5;}
  /* Dark feature card */
  .card-dark{background:#111827;border:1px solid rgba(59,130,246,.2);border-radius:12px;padding:16px;flex:1;min-width:0;}
  .card-dark .card-icon{background:rgba(59,130,246,.1);color:#3B82F6;}
  .card-dark .card-title{color:#E2E8F0;}
  .card-dark .card-desc{color:#94A3B8;}
  /* Stats card */
  .card-stat{background:white;border-radius:14px;padding:16px;text-align:center;flex:0 0 120px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .stat-num{font-size:1.8rem;font-weight:800;color:#2563EB;line-height:1;}
  .stat-lbl{font-size:.72rem;color:#94A3B8;margin-top:4px;}
</style>
</head>
<body>
  <div class="card-light">
    <div class="card-icon">💻</div>
    <div class="card-title">AI 크리에이티브</div>
    <div class="card-desc">AI 도구를 활용해 창의적 결과물을 직접 만드는 경험을 제공합니다</div>
  </div>
  <div class="card-dark">
    <div class="card-icon" style="background:rgba(59,130,246,.1);color:#3B82F6;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;">🤖</div>
    <div class="card-title" style="color:#E2E8F0;font-size:.95rem;font-weight:700;margin-bottom:4px;">실시간 AI 학습</div>
    <div class="card-desc" style="font-size:.8rem;color:#94A3B8;line-height:1.5;">생성형 AI 도구를 직접 조작하며 창작하는 몰입형 수업</div>
  </div>
  <div class="card-stat"><div class="stat-num">500+</div><div class="stat-lbl">수업 진행</div></div>
  <div class="card-stat"><div class="stat-num">20+</div><div class="stat-lbl">제휴 기관</div></div>
</body>
</html>
