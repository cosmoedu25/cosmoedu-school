<!-- @dsCard group="Components" viewport="700x120" name="Chips & Badges" subtitle="Section labels, grade tags, status pills" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:20px 24px;background:#F8FAFC;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .chip{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:.28rem .85rem;border-radius:100px;}
  .chip-cyan{color:#0891B2;background:rgba(8,145,178,.08);border:1px solid rgba(8,145,178,.25);}
  .chip-blue{color:#2563EB;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);}
  .chip-green{color:#059669;background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.2);}
  .chip-purple{color:#7C3AED;background:rgba(124,58,237,.08);border:1px solid rgba(124,58,237,.2);}
  .chip-amber{color:#D97706;background:rgba(217,119,6,.08);border:1px solid rgba(217,119,6,.2);}
  .chip-dark{color:#94A3B8;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.2);}
  .badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:700;color:#2563EB;background:rgba(37,99,235,.08);border:1px solid rgba(37,99,235,.2);padding:.3rem .8rem;border-radius:100px;}
  .dot{width:6px;height:6px;background:#2563EB;border-radius:50%;}
</style>
</head>
<body>
  <div class="chip chip-cyan">CLASS FEATURES</div>
  <div class="chip chip-blue">Platform</div>
  <div class="chip chip-green">1회차</div>
  <div class="chip chip-purple">3회차</div>
  <div class="chip chip-amber">여름방학</div>
  <div class="chip chip-dark">Solution Package</div>
  <div class="badge"><div class="dot"></div>AI 교육 전문기관 인증</div>
</body>
</html>
