<!-- @dsCard group="Brand" viewport="700x160" name="Logos" subtitle="Horizontal wordmark (light/dark) and icon variants" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<style>
  body{margin:0;padding:16px 20px;background:#F8FAFC;font-family:'Segoe UI',sans-serif;display:flex;gap:20px;align-items:center;flex-wrap:wrap;}
  .logo-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px;border-radius:10px;}
  .logo-box-dark{background:#0F172A;}
  .logo-box-light{background:white;border:1px solid #E2E8F0;}
  .logo-label{font-size:9px;color:#94A3B8;font-weight:600;text-align:center;}
  img{display:block;max-width:180px;height:auto;}
  .circle-img{width:48px;height:48px;object-fit:contain;}
</style>
</head>
<body>
  <div class="logo-box logo-box-light">
    <img src="../assets/cosmoedu_logo_black.png" alt="wordmark dark">
    <div class="logo-label">Wordmark — on light</div>
  </div>
  <div class="logo-box logo-box-dark">
    <img src="../assets/cosmoedu_logo_white.png" alt="wordmark white">
    <div class="logo-label" style="color:#64748B;">Wordmark — on dark</div>
  </div>
  <div class="logo-box logo-box-light">
    <img class="circle-img" src="../assets/logo_circle.png" alt="circle icon">
    <div class="logo-label">Icon / Favicon</div>
  </div>
  <div class="logo-box logo-box-light">
    <img class="circle-img" src="../assets/logo.png" alt="square logo">
    <div class="logo-label">Square logo</div>
  </div>
</body>
</html>
