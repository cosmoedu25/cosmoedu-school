<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<style>
  body{margin:0;padding:16px 20px;background:#0A0F1E;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;gap:8px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;}
  .chip{width:100%;height:44px;border-radius:8px;border:1px solid rgba(255,255,255,.08);}
  .name{font-size:8.5px;font-weight:700;color:#94A3B8;text-align:center;}
  .val{font-size:7.5px;color:#64748B;text-align:center;font-family:monospace;}
</style>
</head>
<body>
  <div class="row">
    <div class="swatch"><div class="chip" style="background:#0A0F1E;"></div><div class="name">BG</div><div class="val">#0A0F1E</div></div>
    <div class="swatch"><div class="chip" style="background:#111827;"></div><div class="name">Card</div><div class="val">#111827</div></div>
    <div class="swatch"><div class="chip" style="background:#1A2235;"></div><div class="name">Card 2</div><div class="val">#1A2235</div></div>
    <div class="swatch"><div class="chip" style="background:#3B82F6;"></div><div class="name">Blue</div><div class="val">#3B82F6</div></div>
    <div class="swatch"><div class="chip" style="background:#06B6D4;"></div><div class="name">Cyan</div><div class="val">#06B6D4</div></div>
    <div class="swatch"><div class="chip" style="background:#8B5CF6;"></div><div class="name">Purple</div><div class="val">#8B5CF6</div></div>
    <div class="swatch"><div class="chip" style="background:#10B981;"></div><div class="name">Green</div><div class="val">#10B981</div></div>
    <div class="swatch"><div class="chip" style="background:#F59E0B;"></div><div class="name">Orange</div><div class="val">#F59E0B</div></div>
  </div>
</body>
</html>
