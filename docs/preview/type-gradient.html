<!-- @dsCard group="Type" viewport="700x150" name="Gradient Text" subtitle="Hero headline gradient treatment" -->
<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px 28px;background:#F8FAFC;font-family:'Segoe UI','Malgun Gothic',sans-serif;display:flex;flex-direction:column;gap:16px;justify-content:center;min-height:140px;}
  .g1{font-size:2.4rem;font-weight:900;line-height:1.1;background:linear-gradient(130deg,#2563EB,#0891B2 50%,#7C3AED);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .g2{font-size:1.5rem;font-weight:800;background:linear-gradient(130deg,#2563EB,#06B6D4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .note{font-size:9px;color:#94A3B8;font-family:monospace;margin-top:4px;}
</style>
</head>
<body>
  <div>
    <div class="g1">AI 코딩교육이 됩니다</div>
    <div class="note">linear-gradient(130deg, #2563EB, #0891B2 50%, #7C3AED) — hero use</div>
  </div>
  <div>
    <div class="g2">학년군별 연간 학습로드맵</div>
    <div class="note">linear-gradient(130deg, #2563EB, #06B6D4) — section title use</div>
  </div>
</body>
</html>
